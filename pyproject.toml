[project]
name = "gamma-camera-monte-carlo"
version = "0.1.0"
description = "Generic Monte Carlo model of a gamma camera: transport, detector response, spectra and quantitative projection imaging"
authors = [{ name = "Arianna Ruiz Vossirini" }]
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets `pytest -q` work on a clean checkout without `pip install -e .`, which
# matters on machines with no network access to fetch build dependencies.
pythonpath = ["src"]
